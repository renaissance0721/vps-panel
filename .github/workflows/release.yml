name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum

      - name: Build and package Panel
        env:
          GOARCH: ${{ matrix.arch }}
          ARCHIVE: vps-panel-linux-${{ matrix.arch }}.tar.gz
        run: |
          mkdir -p package/web release-assets
          cd panel
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build \
            -trimpath -ldflags="-s -w" -o ../package/vps-panel ./cmd/panel
          cd ..
          cp -a web/dist/. package/web/
          tar -C package -czf "release-assets/$ARCHIVE" vps-panel web

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-panel-linux-${{ matrix.arch }}
          path: release-assets/vps-panel-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
